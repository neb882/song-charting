[project]
name = "songcharter"
version = "0.5.0"
description = "Make Clone Hero charts from audio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mido>=1.3", "packaging>=24"]   # packaging: packaging/check_wheels.py
separate = ["demucs>=4.1,<5"]   # torch, huggingface_hub, safetensors and pyyaml come with it
drums = ["torch>=2.0"]          # the ADTOF drums engine (engines/adtof.py)
bass = ["librosa>=0.10"]         # the bass rule engine (pYIN, peak picking); scipy and soxr come with it
sections = ["librosa>=0.10"]    # the sections fallback (scipy comes with it); allin1 runs in a Python of its own
preview = ["matplotlib>=3.8", "librosa>=0.10"]   # python -m songcharter.preview (preview.py)
ffmpeg = ["imageio-ffmpeg>=0.6"]   # an ffmpeg binary, for a PC with none on PATH (audio.py)
# the lyrics aligner (engines/lyrics.py): torchaudio's CTC bundles and forced_align. 2.11.1 asks only for torch>=2.11;
# each lane below carries it too, so its build follows the lane (the sources), as in packaging/allin1
lyrics = ["torchaudio==2.11.1"]
app = ["songcharter[separate,drums,bass,sections,preview,ffmpeg,lyrics]"]   # the installed app, with one torch lane below
# The torch lanes: exactly one with `app` (uv sync --frozen --extra app --extra <lane>), each from its own index.
cpu = ["torch==2.15.0", "torchaudio==2.11.1"]    # no NVIDIA GPU
cu126 = ["torch==2.14.1", "torchaudio==2.11.1"]  # an NVIDIA driver under 580
# a driver of 580 or newer. curand: onnxruntime-node's CUDA provider (the guitar) needs libcurand.so.10, the one
# CUDA 13 library the torch wheel does not bring (docs/work-orders/M4-00-plan.md, finding 4); with it, the provider
# loaded and ran in WSL on the owner's RTX 5070, with no library missing [here, 5070 spike]
cu132 = ["torch==2.15.0", "torchaudio==2.11.1", "nvidia-curand==10.4.4.72; sys_platform == 'linux'"]

[project.scripts]
songcharter = "songcharter.cli:main"

[build-system]
requires = ["setuptools>=77"]   # 77: the SPDX `license` string and `license-files` (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["songcharter", "songcharter.engines", "songcharter.ui"]

[tool.setuptools.package-data]
"songcharter.ui" = ["static/*.html", "static/*.js", "static/*.css"]   # the page (ui/server.py serves it)

[tool.uv]
required-version = "==0.13.5"   # the installer's uv (packaging/linux/install.sh)
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu132" }]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]   # WSL2 (native Windows: M4-99)
# the build backend pinned, so a frozen sync builds songcharter and any sdist with the same setuptools every day
build-constraint-dependencies = ["setuptools==84.2.1"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu132", extra = "cu132" },
]
# torchaudio by lane, as packaging/allin1/pyproject.toml has it: PyPI's 2.11.1 is a CUDA 13 build, so the cpu index's
# build (libtorch and libc10 alone) serves cpu and cu126, whose own index has no 2.11.1; cu132 takes its own build.
# The aligner runs forced_align on the CPU, which every build has. check_wheels.py's one cross-index exception.
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cpu", extra = "cu126" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"   # a passing test's folders go at once: the pipeline tests write ~0.5 GB
