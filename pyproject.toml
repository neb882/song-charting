[project]
name = "songcharter"
version = "0.1.0"
description = "Make Clone Hero charts from audio"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mido>=1.3"]
separate = ["demucs>=4.1,<5"]   # torch, huggingface_hub, safetensors and pyyaml come with it

[project.scripts]
songcharter = "songcharter.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["songcharter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
