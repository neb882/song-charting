# allin1's own Python (engines/sections.py runs it as $SONGCHARTER_ALLIN1_PYTHON): a virtual project, locked on the
# same torch lanes as the root project, with the same pins, so the two environments share torch's files in uv's
# cache. Install: UV_PROJECT_ENVIRONMENT=<dir> uv sync --frozen --project packaging/allin1 --extra <lane>
[project]
name = "songcharter-allin1"
version = "0.1.0"
requires-python = "==3.13.*"
# torchaudio 2.11.1 asks only for torch>=2.11, so it runs beside the lane's torch (the runner's probe and a fold-0
# run passed with torch 2.15 on Linux)
dependencies = ["all-in-one-infer==3.1.0", "torchaudio==2.11.1"]

[project.optional-dependencies]
# The torch lanes, as in the root pyproject.toml; cu132 needs no curand here (that is for autochart's provider).
cpu = ["torch==2.15.0"]    # no NVIDIA GPU
cu126 = ["torch==2.14.1"]  # an NVIDIA driver under 580
cu132 = ["torch==2.15.0"]  # a driver of 580 or newer

[tool.uv]
package = false
required-version = "==0.13.5"   # the installer's uv, as in the root project
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu132" }]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
